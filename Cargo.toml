[package]
name = "ico-generator"
version = "3.0.0"
edition = "2021"
rust-version = "1.80"
description = "离线图标生成器：批量生成 ICO / ICNS 图标"

[dependencies]
anyhow = "1"
eframe = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "ico"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
